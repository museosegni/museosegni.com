# Reverse proxy nginx per il CMS Payload di Museo Segni (self-hosted su VPS).
# Il container Docker espone la porta 3001 su 127.0.0.1 (vedi
# apps/cms/docker-compose.prod.yml). Certificato TLS gestito da certbot.
#
# Installazione sul VPS:
#   sudo cp deploy/nginx/cms.museosegni.com.conf /etc/nginx/sites-available/museosegni
#   sudo ln -sf /etc/nginx/sites-available/museosegni /etc/nginx/sites-enabled/museosegni
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name cms.museosegni.com;

    # Payload gestisce upload media: alza il limite di default (1m)
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cms.museosegni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.museosegni.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = cms.museosegni.com) {
        return 301 https://$host$request_uri;
    }

    # Niente default_server: quello resta al blocco di cms.irenesantori.it (cliente1)
    listen 80;
    listen [::]:80;
    server_name cms.museosegni.com;
    return 404;
}
