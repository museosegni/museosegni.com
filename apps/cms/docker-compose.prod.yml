version: '3'

# Deploy di produzione sul VPS: Payload CMS + Postgres, media su disco locale
# persistente (nessun Vercel Blob, vedi payload.config.ts). Il container `cms`
# non espone porte pubblicamente: ci pensa nginx (reverse proxy sul VPS) a
# esporre cms.museosegni.com in HTTPS verso la porta 3001 dell'host.
#
# Porta host 3001 (non 3000): sullo stesso VPS gira già un altro CMS Payload
# (cms.irenesantori.it) sulla 3000, vedi /etc/nginx/sites-available/cliente1.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: museosegni
      POSTGRES_DB: museosegni_cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  cms:
    build:
      # Contesto = radice del monorepo: il Dockerfile ha bisogno del lockfile
      # pnpm e del workspace, non solo di apps/cms (vedi commenti nel Dockerfile).
      context: ../..
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env.prod
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      # Il server standalone di Next fa chdir nella cartella di apps/cms
      # all'avvio, quindi lo staticDir relativo 'media' (Media.ts) risolve
      # in /app/apps/cms/media dentro il container, non /app/media.
      - media:/app/apps/cms/media

volumes:
  pgdata:
  media:
