packages:
  - "apps/*"

# Dipendenze native di cui pnpm può eseguire gli script di build (necessarie a
# Payload/sharp per la conversione immagini).
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Versioni corrette forzate su dipendenze indirette che le fissano a versioni
# segnalate dagli scanner: dompurify da monaco-editor (admin Payload), esbuild
# da drizzle-kit (strumento di schema di Payload), postcss-selector-parser da
# Tailwind 3. Verificate: build, sync schema, migrate:create, CSS identico.
overrides:
  dompurify@3: ^3.4.16
  esbuild@<0.28: ^0.28.1
  postcss-selector-parser@6: ^7.1.6

minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - dompurify@3.3.2
  - dompurify@3.4.0
  - dompurify@3.4.6
  - dompurify@3.4.7
  - dompurify@3.4.11
  - dompurify@3.4.9
  - dompurify@3.4.8
  - dompurify@3.3.4
  - brace-expansion@1.1.17
  - brace-expansion@5.0.8
  - postcss@8.5.23
  - undici@6.28.0
  - fast-uri@3.1.5
  - brace-expansion@5.0.9
  - brace-expansion@1.1.18
  - js-yaml@4.3.1
  - dompurify@3.4.13
  - nanoid@3.3.18
  - browserslist@4.28.7
  - fast-uri@3.1.6
  - baseline-browser-mapping@2.11.0
  - js-yaml@4.3.2
  - undici@6.28.1
  - fast-uri@3.1.7
  - fast-uri@3.1.8
  - brace-expansion@1.1.21
  - brace-expansion@5.0.12
  - brace-expansion@1.1.20
  - brace-expansion@5.0.11
  - brace-expansion@1.1.19
  - brace-expansion@5.0.10
  - dompurify@3.4.12
  - dompurify@3.4.16
  - source-map-js@1.2.2
  - postcss-selector-parser@7.1.6
  - fast-copy@3.1.0
